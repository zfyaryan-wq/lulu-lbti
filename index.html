<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>水豚噜噜 LBTI 人格测试</title>
  <style>
    :root {
      --bg: #fff7ec;
      --card: rgba(255, 255, 255, 0.82);
      --text: #382519;
      --muted: #7a6555;
      --brand: #d7824a;
      --brand-dark: #9b5529;
      --pink: #ff8fb3;
      --green: #8fbf8f;
      --shadow: 0 20px 50px rgba(99, 60, 32, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--text);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(circle at 14% 12%, rgba(255, 143, 179, 0.28), transparent 26%),
        radial-gradient(circle at 88% 18%, rgba(143, 191, 143, 0.26), transparent 28%),
        linear-gradient(145deg, #fff0dc 0%, var(--bg) 48%, #f7ead8 100%);
    }

    .page {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(155, 85, 41, 0.18);
      border-radius: 32px;
      padding: 42px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .hero::after {
      content: "噜噜";
      position: absolute;
      right: -10px;
      bottom: -34px;
      color: rgba(215, 130, 74, 0.11);
      font-size: 132px;
      font-weight: 900;
      letter-spacing: -8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--brand-dark);
      background: rgba(215, 130, 74, 0.14);
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 18px 0 12px;
      font-size: clamp(34px, 7vw, 72px);
      line-height: 0.96;
      letter-spacing: -2px;
    }

    .subtitle {
      position: relative;
      z-index: 1;
      max-width: 670px;
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .capybara {
      position: relative;
      z-index: 1;
      width: min(300px, 100%);
      height: 170px;
      margin: 34px 0 4px;
    }

    .body {
      position: absolute;
      left: 16px;
      bottom: 8px;
      width: 252px;
      height: 118px;
      border-radius: 64px 72px 54px 54px;
      background: linear-gradient(160deg, #b9794e, #8f5434);
      box-shadow: inset -18px -18px 0 rgba(85, 43, 25, 0.12);
    }

    .ear {
      position: absolute;
      top: 34px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #8f5434;
    }

    .ear.left {
      left: 60px;
    }

    .ear.right {
      left: 196px;
    }

    .eye {
      position: absolute;
      top: 76px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2e1c14;
    }

    .eye.left {
      left: 88px;
    }

    .eye.right {
      left: 184px;
    }

    .nose-hole {
      position: absolute;
      top: 102px;
      width: 10px;
      height: 6px;
      border-radius: 50%;
      background: #2e1c14;
      opacity: 0.72;
    }

    .nose-hole.left {
      left: 132px;
      transform: rotate(-8deg);
    }

    .nose-hole.right {
      left: 154px;
      transform: rotate(8deg);
    }

    .whisper {
      position: absolute;
      left: 202px;
      top: 6px;
      padding: 10px 14px;
      border-radius: 18px 18px 18px 4px;
      background: #fff;
      color: var(--brand-dark);
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(99, 60, 32, 0.12);
      transform: rotate(5deg);
    }

    .panel {
      margin-top: 26px;
      border-radius: 28px;
      padding: 28px;
      background: rgba(255, 255, 255, 0.74);
      box-shadow: var(--shadow);
      border: 1px solid rgba(155, 85, 41, 0.12);
    }

    .question {
      padding: 22px 0;
      border-bottom: 1px dashed rgba(122, 101, 85, 0.28);
    }

    .question:last-child {
      border-bottom: 0;
    }

    .question h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: flex;
      min-height: 72px;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border: 2px solid rgba(155, 85, 41, 0.14);
      border-radius: 18px;
      background: #fffaf2;
      cursor: pointer;
      transition: 0.18s ease;
    }

    label:hover {
      transform: translateY(-2px);
      border-color: rgba(215, 130, 74, 0.55);
      box-shadow: 0 10px 22px rgba(99, 60, 32, 0.1);
    }

    label:has(input:checked) {
      border-color: rgba(215, 130, 74, 0.82);
      background: #fff0dc;
      box-shadow: 0 10px 22px rgba(215, 130, 74, 0.16);
    }

    input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--brand);
      flex: 0 0 auto;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      color: white;
      background: linear-gradient(135deg, var(--brand), var(--pink));
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(215, 130, 74, 0.25);
      transition: 0.18s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(215, 130, 74, 0.32);
    }

    .ghost {
      color: var(--brand-dark);
      background: rgba(215, 130, 74, 0.13);
      box-shadow: none;
    }

    .result {
      display: none;
      margin-top: 26px;
      border: 2px solid rgba(215, 130, 74, 0.28);
      border-radius: 30px;
      padding: 28px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.86), rgba(255, 245, 231, 0.92)),
        radial-gradient(circle at 90% 0%, rgba(255, 143, 179, 0.22), transparent 36%);
      box-shadow: var(--shadow);
    }

    .result.show {
      display: block;
    }

    .type {
      margin: 0 0 10px;
      color: var(--brand-dark);
      font-size: clamp(42px, 10vw, 88px);
      line-height: 0.9;
      letter-spacing: 2px;
    }

    .result h3 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    .result p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .result-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .meta-card {
      min-height: 112px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 250, 242, 0.76);
      border: 1px solid rgba(155, 85, 41, 0.12);
    }

    .meta-card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--brand-dark);
      font-size: 15px;
    }

    .meta-card span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .chip {
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--brand-dark);
      background: rgba(215, 130, 74, 0.12);
      font-size: 13px;
      font-weight: 800;
    }

    .share {
      margin-top: 18px;
      padding: 16px;
      border-radius: 18px;
      color: var(--brand-dark);
      background: rgba(215, 130, 74, 0.12);
      font-weight: 800;
    }

    .toast {
      display: none;
      margin-top: 12px;
      color: var(--brand-dark);
      font-weight: 700;
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 720px) {
      .page {
        width: 100%;
        padding: max(14px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
      }

      .hero,
      .panel,
      .result {
        padding: 20px;
        border-radius: 24px;
        box-shadow: 0 14px 34px rgba(99, 60, 32, 0.13);
      }

      .hero::after {
        right: -18px;
        bottom: -20px;
        font-size: 82px;
        letter-spacing: -5px;
      }

      .badge {
        padding: 7px 11px;
        font-size: 12px;
      }

      h1 {
        margin-top: 14px;
        font-size: clamp(38px, 13vw, 54px);
        letter-spacing: -1px;
      }

      .subtitle {
        font-size: 15px;
        line-height: 1.65;
      }

      .capybara {
        width: 240px;
        height: 134px;
        margin-top: 22px;
        transform: scale(0.92);
        transform-origin: left bottom;
      }

      .body {
        width: 220px;
        height: 100px;
      }

      .ear.left {
        left: 56px;
      }

      .ear.right {
        left: 172px;
      }

      .eye.left {
        left: 78px;
      }

      .eye.right {
        left: 160px;
      }

      .nose-hole {
        top: 96px;
      }

      .nose-hole.left {
        left: 118px;
      }

      .nose-hole.right {
        left: 138px;
      }

      .panel {
        margin-top: 16px;
      }

      .question {
        padding: 18px 0;
      }

      .question h2 {
        font-size: 17px;
        line-height: 1.45;
      }

      .options {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      label {
        min-height: 60px;
        padding: 13px 14px;
        border-radius: 16px;
        font-size: 15px;
        line-height: 1.45;
      }

      input[type="radio"] {
        width: 20px;
        height: 20px;
      }

      .actions {
        position: sticky;
        bottom: max(10px, env(safe-area-inset-bottom));
        z-index: 5;
        display: grid;
        grid-template-columns: 1fr;
        margin: 20px -4px 0;
        padding: 10px;
        border: 1px solid rgba(155, 85, 41, 0.12);
        border-radius: 22px;
        background: rgba(255, 250, 242, 0.9);
        box-shadow: 0 12px 26px rgba(99, 60, 32, 0.16);
        backdrop-filter: blur(14px);
      }

      button {
        width: 100%;
        min-height: 48px;
        padding: 13px 16px;
        font-size: 15px;
      }

      .whisper {
        left: 156px;
        top: -4px;
        padding: 8px 11px;
        font-size: 12px;
      }

      .type {
        font-size: clamp(48px, 20vw, 72px);
      }

      .result h3 {
        font-size: 21px;
        line-height: 1.35;
      }

      .result p {
        font-size: 15px;
        line-height: 1.7;
      }

      .result-meta {
        grid-template-columns: 1fr;
      }

      .share {
        font-size: 14px;
        line-height: 1.55;
      }
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .hero,
      .panel,
      .result {
        padding: 18px;
        border-radius: 22px;
      }

      h1 {
        font-size: 36px;
      }

      .capybara {
        margin-left: -12px;
        transform: scale(0.82);
      }

      label {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <span class="badge">人类 MBTI 史上伟大的一天</span>
      <h1>水豚噜噜<br />LBTI 人格测试</h1>
      <p class="subtitle">
        你是 XXBK 细寻鼻孔，还是 YZLB 硬找噜鼻？
        8 道题，测出你的噜噜人格。
      </p>

      <div class="capybara" aria-hidden="true">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="body"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose-hole left"></div>
        <div class="nose-hole right"></div>
        <div class="whisper">细思鼻孔</div>
      </div>
    </section>

    <form class="panel" id="quiz">
      <div class="question">
        <h2>1. 看到一只小噜噜，你第一反应是？</h2>
        <div class="options">
          <label><input type="radio" name="q1" value="Y" /> 硬说可爱，先认领精神抚养权</label>
          <label><input type="radio" name="q1" value="X" /> 细看两秒，确认它到底哪里可爱</label>
        </div>
      </div>

      <div class="question">
        <h2>2. 朋友说“我还有一只噜噜”，你会？</h2>
        <div class="options">
          <label><input type="radio" name="q2" value="Y" /> 真有啊？我去，必须硬看！</label>
          <label><input type="radio" name="q2" value="X" /> 发来，我要细节图和正脸图</label>
        </div>
      </div>

      <div class="question">
        <h2>3. 面对“捏他鼻子”这个请求，你会？</h2>
        <div class="options">
          <label><input type="radio" name="q3" value="S" /> 先思考：人家哪儿有鼻子？</label>
          <label><input type="radio" name="q3" value="Z" /> 别管，先找，替我捏一下</label>
        </div>
      </div>

      <div class="question">
        <h2>4. 当大家开始硬找噜鼻时，你的态度是？</h2>
        <div class="options">
          <label><input type="radio" name="q4" value="X" /> 细寻鼻孔，逐帧找证据</label>
          <label><input type="radio" name="q4" value="Z" /> 硬找噜鼻，找不到也要找</label>
        </div>
      </div>

      <div class="question">
        <h2>5. 你遇到萌物时的语言状态是？</h2>
        <div class="options">
          <label><input type="radio" name="q5" value="L" /> 爱鼠了这小噜噜，谁懂</label>
          <label><input type="radio" name="q5" value="B" /> 等等，我先看它鼻部结构</label>
        </div>
      </div>

      <div class="question">
        <h2>6. 朋友发来噜噜照片，你会？</h2>
        <div class="options">
          <label><input type="radio" name="q6" value="L" /> 我不行了，小噜噜本体太强</label>
          <label><input type="radio" name="q6" value="B" /> 那是鼻孔吗？鼻毛多么带孔</label>
        </div>
      </div>

      <div class="question">
        <h2>7. 出现“细思鼻孔”这种词时，你会？</h2>
        <div class="options">
          <label><input type="radio" name="q7" value="K" /> 立刻缩写成 XSBK，重点是孔</label>
          <label><input type="radio" name="q7" value="B" /> 我宣布这是噜鼻，不接受反驳</label>
        </div>
      </div>

      <div class="question">
        <h2>8. 你会把自己的 MBTI 改成？</h2>
        <div class="options">
          <label><input type="radio" name="q8" value="K" /> XXBK / XSBK，孔学必须有姓名</label>
          <label><input type="radio" name="q8" value="B" /> YZLB，硬找噜鼻才是归宿</label>
        </div>
      </div>

      <div class="actions">
        <button type="submit">测测我的 LBTI</button>
        <button class="ghost" type="button" id="randomBtn">随机生成小噜噜人格</button>
        <button class="ghost" type="reset" id="resetBtn">重新测试</button>
      </div>
      <div class="toast" id="toast">先把 8 道题都选完，噜噜才会现身。</div>
    </form>

    <section class="result" id="result" aria-live="polite">
      <h2 class="type" id="typeCode">XXBK</h2>
      <h3 id="typeName">细寻鼻孔型</h3>
      <p id="typeDesc"></p>
      <div class="chips" id="typeChips"></div>
      <div class="result-meta" id="typeMeta"></div>
      <div class="share" id="shareText"></div>
    </section>
  </main>

  <script>
    const quiz = document.querySelector("#quiz");
    const result = document.querySelector("#result");
    const typeCode = document.querySelector("#typeCode");
    const typeName = document.querySelector("#typeName");
    const typeDesc = document.querySelector("#typeDesc");
    const typeChips = document.querySelector("#typeChips");
    const typeMeta = document.querySelector("#typeMeta");
    const shareText = document.querySelector("#shareText");
    const toast = document.querySelector("#toast");
    const randomBtn = document.querySelector("#randomBtn");
    const resetBtn = document.querySelector("#resetBtn");

    const dimensions = [
      ["X", "Y"],
      ["X", "S", "Z"],
      ["B", "L"],
      ["K", "B"]
    ];

    const positionNames = [
      { X: "细", Y: "硬" },
      { X: "寻", S: "思", Z: "找" },
      { B: "鼻", L: "噜" },
      { K: "孔", B: "鼻" }
    ];

    const axisDetails = [
      {
        X: "细看派：先放大、再截图、最后进入显微镜级别的噜噜观察。",
        Y: "硬找派：先宣布有，再发动全群一起找，气势比证据更早抵达。"
      },
      {
        X: "寻迹型：擅长从阴影、褶皱和表情里寻找噜学证据。",
        S: "思辨型：会认真问“那是鼻孔吗”，但越问越觉得有道理。",
        Z: "找补型：即使一开始看不见，也能用十种角度把噜鼻找出来。"
      },
      {
        B: "鼻部本位：你关注的是孔、毛、鼻梁和一切疑似鼻的地方。",
        L: "噜噜本位：你关注的是整只小噜噜，以及它造成的人类语言系统崩塌。"
      },
      {
        K: "孔学落点：结论最终落在“孔”上，追求一种细思极恐的精确。",
        B: "噜鼻落点：结论最终落在“鼻”上，重点不是孔不孔，是必须有个鼻。"
      }
    ];

    const specialResults = {
      XXBK: {
        name: "细寻鼻孔型",
        desc: "你是经典噜学显微镜。别人看到水豚，你看到鼻孔；别人说“哪儿有鼻子”，你已经开始调亮度、放大、截图、圈重点。",
        tags: ["细思鼻孔", "截图派", "噜学考据"],
        details: ["观察力像开了微距镜头，越小的细节越能让你兴奋。", "群聊里你通常负责提供证据链：原图、放大图、二次放大图。", "建议把结论发慢一点，不然朋友还没看懂，你已经进入 XXBK 论文答辩。"]
      },
      YZLB: {
        name: "硬找噜鼻型",
        desc: "你是气势型噜噜学家。证据可以稍后补，态度必须先到位。只要有人说“仔细看”，你就会立刻加入硬找噜鼻大队。",
        tags: ["硬找噜鼻", "先信再说", "群聊起哄王"],
        details: ["你的可爱雷达启动很快，常常先被噜噜击中，再回头寻找理论依据。", "你适合负责把冷场话题炒热，一句“真有啊”就能让全场开始放大图片。", "建议保留一点刹车系统，避免把普通阴影也认证成国家级噜鼻。"]
      },
      YXBK: {
        name: "硬寻鼻孔型",
        desc: "你表面是硬找派，内心却有一套严谨检索流程。你会先大喊“我去真有”，然后开始认真定位鼻孔坐标。",
        tags: ["先冲后证", "鼻孔定位员", "精神捏鼻"],
        details: ["你既有起哄的热情，也有考据的耐心，是群聊里很稀缺的复合型噜才。", "你容易把一句玩笑发展成完整项目：命名、分类、测试、传播，一条龙。", "建议给每个重大发现留一个版本号，比如 YXBK v2.0。"]
      },
      XSBK: {
        name: "细思鼻孔型",
        desc: "你是原教旨细思鼻孔派。你不会轻易下结论，但一旦开始想，就会从“那是鼻孔吗”想到“鼻毛多么带孔”。",
        tags: ["细思鼻孔", "理性崩溃", "鼻孔哲学"],
        details: ["你擅长把荒谬问题认真化，并在认真到一半时把自己逗崩。", "朋友发图时，你往往不是第一个笑的人，但会是把梗续到最后的人。", "建议把你的分析做成系列栏目：今日噜鼻、每周鼻孔、年度细思。"]
      },
      XZLB: {
        name: "细找噜鼻型",
        desc: "你是冷静但不放弃的找鼻派。你不会大喊大叫，却会默默把图片放大三次，直到找到一个能被称作“噜鼻”的东西。",
        tags: ["安静找鼻", "冷面笑匠", "细节执念"],
        details: ["你的幽默点比较后发，通常在别人笑完后，你突然补一句更离谱的。", "你适合做测试里的隐藏高分选手，不声张，但判断很准。", "建议多发一点你的观察过程，群众需要你的显微镜。"]
      }
    };

    function getCheckedValue(name) {
      const checked = document.querySelector(`input[name="${name}"]:checked`);
      return checked ? checked.value : "";
    }

    function pickDimension(options, answers) {
      const scores = options.map((option) => ({
        option,
        score: answers.filter((answer) => answer === option).length
      }));
      scores.sort((a, b) => b.score - a.score);
      return scores[0].option;
    }

    function getPhrase(code) {
      return code.split("").map((letter, index) => positionNames[index][letter]).join("");
    }

    function getGenericDetails(code) {
      return code.split("").map((letter, index) => axisDetails[index][letter]);
    }

    function buildResult(code) {
      if (specialResults[code]) return specialResults[code];

      const phrase = getPhrase(code);
      const displayName = `${phrase}型`;
      const desc = `你的噜噜人格是 ${displayName}。这个结果严格按拼音首字母生成：${code.split("").join(" ")} 对应 ${phrase.split("").join(" ")}。你对小噜噜既有本能的爱，也有独特的观察角度；一旦进入“细思鼻孔”现场，很可能成为朋友群里那个把梗续到第二天的人。`;
      const tags = [`${phrase}`, "噜噜人格", "可爱失控"];
      const details = getGenericDetails(code);

      return { name: displayName, desc, tags, details };
    }

    function showResult(code) {
      const data = buildResult(code);
      typeCode.textContent = code;
      typeName.textContent = data.name;
      typeDesc.textContent = data.desc;
      typeChips.innerHTML = (data.tags || []).map((tag) => `<span class="chip">${tag}</span>`).join("");
      typeMeta.innerHTML = (data.details || getGenericDetails(code)).map((detail, index) => {
        const titles = ["人格底色", "群聊表现", "噜学建议"];
        return `<div class="meta-card"><strong>${titles[index] || "补充观察"}</strong><span>${detail}</span></div>`;
      }).join("");
      shareText.textContent = `我的 LBTI 是 ${code}：${data.name}。今天是人类 MBTI 史上伟大的一天。`;
      result.classList.add("show");
      result.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function calculate() {
      const answers = Array.from({ length: 8 }, (_, index) => getCheckedValue(`q${index + 1}`));
      if (answers.some((answer) => !answer)) {
        toast.classList.add("show");
        return;
      }

      toast.classList.remove("show");
      const code = [
        pickDimension(dimensions[0], answers.slice(0, 2)),
        pickDimension(dimensions[1], answers.slice(2, 4)),
        pickDimension(dimensions[2], answers.slice(4, 6)),
        pickDimension(dimensions[3], answers.slice(6, 8))
      ].join("");

      showResult(code);
    }

    quiz.addEventListener("submit", (event) => {
      event.preventDefault();
      calculate();
    });

    randomBtn.addEventListener("click", () => {
      const code = dimensions.map((dimension) => dimension[Math.floor(Math.random() * dimension.length)]).join("");
      toast.classList.remove("show");
      showResult(code);
    });

    resetBtn.addEventListener("click", () => {
      result.classList.remove("show");
      toast.classList.remove("show");
    });
  </script>
</body>
</html>
